[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-risk-clause-classifier"
version = "0.2.0"
description = "Clause-level risk detection in commercial contracts (CUAD v1)"
readme = "README.md"
requires-python = ">=3.10"
# The data layer is standard library only, so preparing the dataset and running
# its tests needs no install. Model dependencies arrive with the models.
dependencies = []

[project.optional-dependencies]
# Only the dataset report needs a plotting library.
analysis = ["matplotlib>=3.8"]

[project.scripts]
legal-risk-prepare = "legal_risk_classifier.prepare:main"
legal-risk-analyze = "legal_risk_classifier.analyze:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
